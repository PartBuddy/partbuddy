name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: [self-hosted, partbuddy]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release made here with GITHUB_TOKEN triggers no "release" workflows, so the website
  # sync is called directly.
  website:
    name: Update the website
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    # actionlint 1.7.12 rejects the self-repository form $/…; switch once it supports it.
    uses: ./.github/workflows/site-sync.yml # zizmor: ignore[self-repository]
    with:
      release: true
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}

  # The macOS dmg cannot be built on the Windows machine that uploads the installer by hand, so the
  # installer workflow builds it for the new tag and attaches it to the release.
  dmg:
    name: Attach the macOS dmg
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/installer.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      attach: true
