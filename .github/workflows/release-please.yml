name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: [self-hosted, partbuddy]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please creates the release as a draft (with its tag, force-tag-creation), so installed
  # apps never see a release whose latest.yml is still missing.
  installers:
    name: Attach the installers
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/installer.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      attach: true

  publish:
    name: Publish the release
    needs: [release-please, installers]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # main, not the tag: after a refusal, a fixed site/whats-new.md on main lets the job re-run.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      # The website shows its "New in" card only from a "## What's new" section (docs/website.md).
      - name: Add the What's new section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          f=site/whats-new.md
          if [ "$(head -n 1 "$f")" != "<!-- $TAG -->" ]; then
            echo "::error file=$f::$f is not written for $TAG. Write its What's new for $TAG, merge it to main, then re-run this job; the release stays a draft until then."
            exit 1
          fi
          gh release view "$TAG" --json body --jq .body --repo "$GITHUB_REPOSITORY" > body.md
          if ! grep -q "^## What's new" body.md; then
            { head -n 1 body.md; echo; tail -n +2 "$f"; tail -n +2 body.md; } > notes.md
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

  # A release made here with GITHUB_TOKEN triggers no "release" workflows, so the website
  # sync is called directly, once the release is public.
  website:
    name: Update the website
    needs: [release-please, publish]
    permissions:
      contents: read
    # actionlint 1.7.12 rejects the self-repository form $/…; switch once it supports it.
    uses: ./.github/workflows/site-sync.yml # zizmor: ignore[self-repository]
    with:
      release: true
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
