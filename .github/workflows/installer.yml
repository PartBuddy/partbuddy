name: Installer

# Builds the Windows installer and the macOS dmg from a tag or branch on GitHub-hosted runners and
# keeps them as workflow artifacts. Started by hand for now; it publishes nothing. Code signing through the
# SignPath Foundation needs exactly this: every job up to the signing request on GitHub-hosted
# runners, and the unsigned file stored as a workflow artifact first (docs/code-signing-policy.md).
# The self-hosted runners of ADR 0022 are therefore not used here.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to build
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: installer-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          lfs: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the installer
        run: pnpm --filter @partbuddy/desktop dist

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: partbuddy-installer-windows
          path: |
            apps/desktop/dist/PartBuddy-Setup-*.exe
            apps/desktop/dist/PartBuddy-Setup-*.exe.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS dmg
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          lfs: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The universal app needs the native credential store of both architectures.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --cpu=arm64,x64

      - name: Build the dmg
        run: pnpm --filter @partbuddy/desktop dist:mac

      - name: Keep the dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: partbuddy-dmg-macos
          path: apps/desktop/dist/PartBuddy-*-mac-universal.dmg
          if-no-files-found: error
          retention-days: 14

      # Nobody on the team has a Mac: the runner is the only place that shows whether the app is
      # universal, signed ad hoc, carries both credential stores and survives its start.
      - name: Check the app
        working-directory: apps/desktop/dist/mac-universal
        run: |
          set -euo pipefail
          app=PartBuddy.app
          lipo -archs "$app/Contents/MacOS/PartBuddy" | tee /dev/stderr | grep -q 'x86_64 arm64'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep 'Signature=adhoc'
          test "$(find "$app" -name 'keyring.darwin-*.node' | tee /dev/stderr | wc -l)" -eq 2
          ls -la "$app/Contents/Resources" | grep -v lproj
          test "$(stat -f%z "$app/Contents/Resources/app.asar")" -gt 1000000
          ELECTRON_ENABLE_LOGGING=1 "$app/Contents/MacOS/PartBuddy" > start.log 2>&1 &
          pid=$!
          sleep 25
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" && code=0 || code=$?
            echo "PartBuddy did not stay running (exit code $code)"
            cat start.log
            find "$HOME/Library" -newer start.log -type f -not -path '*/Caches/*' 2>/dev/null | head -n 40
            cat "$HOME/Library/Application Support/PartBuddy/logs/partbuddy.log" || true
            for report in "$HOME"/Library/Logs/DiagnosticReports/PartBuddy*; do head -n 80 "$report" || true; done
            exit 1
          fi
          kill "$pid"
          tail -n 40 start.log
