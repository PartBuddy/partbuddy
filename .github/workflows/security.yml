name: Security checks

# Code scanning, dependency review and secret scanning are not available on private repositories
# of personal accounts (docs/github-setup.md). These checks cover the same risks with open tools.

on:
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What the change touches
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, partbuddy]
    timeout-minutes: 5
    outputs:
      dependencies: ${{ steps.paths.outputs.dependencies }}
      workflows: ${{ steps.paths.outputs.workflows }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The self-hosted runner shares one workspace between workflows; a checkout without LFS
          # would leave pointer files that a later checkout with LFS does not replace (ADR 0022).
          lfs: true
          # The merge commit and its first parent, the base branch: their difference is what the merge brings.
          fetch-depth: 2
          persist-credentials: false

      - name: List the changed paths
        id: paths
        shell: bash
        run: git diff --name-only HEAD^1 HEAD | tee /dev/stderr | tools/ci/changes.sh | tee -a "$GITHUB_OUTPUT"

  zizmor:
    name: Workflow security (zizmor)
    # Pull requests only when they touch GitHub workflows or settings (tools/ci/changes.sh); the weekly scan runs always.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true') }}
    # Pull requests run on the self-hosted runner (ADR 0022); the weekly scan stays on a
    # GitHub-hosted runner so it runs even when the PC is off (a few minutes a month).
    runs-on: ${{ github.event_name == 'schedule' && 'ubuntu-24.04' || 'partbuddy' }}
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The self-hosted runner shares one workspace between workflows; a checkout without LFS
          # would leave pointer files that a later checkout with LFS does not replace (ADR 0022).
          lfs: true
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Audit workflows
        run: uvx zizmor==1.31.1 --offline --min-severity low .github/workflows

  dependencies:
    name: Vulnerabilities and licences
    # Pull requests only when they touch package manifests, the lockfile or the licence check (tools/ci/changes.sh); the weekly scan runs always.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.dependencies == 'true') }}
    # Pull requests run on the self-hosted runner (ADR 0022); the weekly scan stays on a
    # GitHub-hosted runner so it runs even when the PC is off (a few minutes a month).
    runs-on: ${{ github.event_name == 'schedule' && 'ubuntu-24.04' || 'partbuddy' }}
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The self-hosted runner shares one workspace between workflows; a checkout without LFS
          # would leave pointer files that a later checkout with LFS does not replace (ADR 0022).
          lfs: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner instance: the default ~/setup-pnpm is shared by the parallel instances on
          # the self-hosted runner, and concurrent installs there break each other (ADR 0022).
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit for known vulnerabilities
        run: pnpm audit --audit-level moderate

      - name: Check licences of shipped dependencies
        run: pnpm licenses:check
