name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: [self-hosted, partbuddy]
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner instance: the default ~/setup-pnpm is shared by the parallel instances on
          # the self-hosted runner, and concurrent installs there break each other (ADR 0022).
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Click dummy flows (Playwright)
    runs-on: [self-hosted, partbuddy]
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner instance: the default ~/setup-pnpm is shared by the parallel instances on
          # the self-hosted runner, and concurrent installs there break each other (ADR 0022).
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # System libraries come with the runner (tools/runner/provision.sh); the browser is cached there.
      - name: Install Chromium
        run: pnpm --filter @partbuddy/clickdummy exec playwright install chromium

      - name: Run flows, console and accessibility checks
        run: pnpm --filter @partbuddy/clickdummy exec playwright test --project=flows

  desktop-e2e:
    name: Desktop app flows (Playwright Electron)
    runs-on: [self-hosted, partbuddy]
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner instance: the default ~/setup-pnpm is shared by the parallel instances on
          # the self-hosted runner, and concurrent installs there break each other (ADR 0022).
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 45 downloads its binary on first use and verifies it against checksums.json.
      - name: Download Electron
        run: node apps/desktop/node_modules/electron/install.js

      # System libraries and xvfb come with the runner (tools/runner/provision.sh). The WSL kernel
      # has no AppArmor, so Chromium's sandbox works without relaxing anything.
      - name: Build the app
        run: pnpm --filter @partbuddy/desktop build

      - name: Run flows against the fake SolidCraft, bridge and accessibility checks
        run: xvfb-run --auto-servernum pnpm --filter @partbuddy/desktop exec playwright test
