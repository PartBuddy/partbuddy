name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests run only the checks their change can affect (tools/ci/changes.sh); skipped jobs show as such.
  changes:
    name: What the change touches
    runs-on: [self-hosted, partbuddy]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      desktop: ${{ steps.paths.outputs.desktop }}
      clickdummy: ${{ steps.paths.outputs.clickdummy }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The self-hosted runner shares one workspace between workflows; a checkout without LFS
          # would leave pointer files that a later checkout with LFS does not replace (ADR 0022).
          lfs: true
          # The merge commit and its first parent, the base branch: their difference is what the merge brings.
          fetch-depth: 2
          persist-credentials: false

      - name: List the changed paths
        id: paths
        shell: bash
        run: git diff --name-only HEAD^1 HEAD | tee /dev/stderr | tools/ci/changes.sh | tee -a "$GITHUB_OUTPUT"

  verify:
    name: Lint, typecheck, test, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, partbuddy]
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner instance: the default ~/setup-pnpm is shared by the parallel instances on
          # the self-hosted runner, and concurrent installs there break each other (ADR 0022).
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typed lint takes about as long as typecheck and tests together, mostly on one core: it runs beside
      # them, and the step "Lint" below shows its output and result. RUNNER_TEMP is emptied for every job.
      - name: Start lint
        run: (pnpm lint > "$RUNNER_TEMP/lint.log" 2>&1; echo $? > "$RUNNER_TEMP/lint.exit") &

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        if: ${{ !cancelled() }}
        run: |
          while [ ! -f "$RUNNER_TEMP/lint.exit" ]; do sleep 2; done
          cat "$RUNNER_TEMP/lint.log"
          exit "$(cat "$RUNNER_TEMP/lint.exit")"

      - name: Build
        run: pnpm build

  e2e:
    name: Click dummy flows (Playwright)
    needs: changes
    if: needs.changes.outputs.clickdummy == 'true'
    runs-on: [self-hosted, partbuddy]
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner instance: the default ~/setup-pnpm is shared by the parallel instances on
          # the self-hosted runner, and concurrent installs there break each other (ADR 0022).
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # System libraries come with the runner (tools/runner/provision.sh); the browser is cached there.
      - name: Install Chromium
        run: pnpm --filter @partbuddy/clickdummy exec playwright install chromium

      - name: Run flows, console and accessibility checks
        run: pnpm --filter @partbuddy/clickdummy exec playwright test --project=flows

  desktop-e2e:
    name: Desktop app flows (Playwright Electron)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # Three shards with two workers each: about 4 minutes instead of 12 on one worker (pull request text of
    # this change). Each shard starts its own apps, so one red shard does not stop the others.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: [self-hosted, partbuddy]
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner instance: the default ~/setup-pnpm is shared by the parallel instances on
          # the self-hosted runner, and concurrent installs there break each other (ADR 0022).
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 45 downloads its binary on first use and verifies it against checksums.json.
      - name: Download Electron
        run: node apps/desktop/node_modules/electron/install.js

      # System libraries and xvfb come with the runner (tools/runner/provision.sh). The WSL kernel
      # has no AppArmor, so Chromium's sandbox works without relaxing anything.
      - name: Build the app
        run: pnpm --filter @partbuddy/desktop build

      - name: Run flows against the fake SolidCraft, bridge and accessibility checks
        run: xvfb-run --auto-servernum pnpm --filter @partbuddy/desktop exec playwright test --project=app --shard="$SHARD/3" --workers=2
        env:
          SHARD: ${{ matrix.shard }}

      # Screenshots, traces and error contexts of the failed flows, to read the cause of a flaky test without a rerun.
      - name: Keep the results of failed flows
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-flow-results-${{ matrix.shard }}
          path: apps/desktop/test-results
          retention-days: 14
