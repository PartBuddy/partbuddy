name: Commit messages

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: [self-hosted, partbuddy]
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The self-hosted runner shares one workspace between workflows; a checkout without LFS
          # would leave pointer files that a later checkout with LFS does not replace (ADR 0022).
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner instance: the default ~/setup-pnpm is shared by the parallel instances on
          # the self-hosted runner, and concurrent installs there break each other (ADR 0022).
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
