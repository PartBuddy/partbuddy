version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 10
    labels: ["type: dependencies"]
    commit-message:
      prefix: build
      include: scope
    groups:
      tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: ["type: dependencies"]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
