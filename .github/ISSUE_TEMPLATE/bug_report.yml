name: Bug report
description: Something does not work as described.
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove personal data (names, paths, e-mail addresses, API keys) from logs and screenshots before posting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with …
        2. Pin a note to a face …
        3. Ask the assistant to …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - 3D viewer
        - Notes and anchors
        - Chat and AI providers
        - CAD kernel connection
        - Checks and print package
        - Installer and updates
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: AI provider and model (if relevant)
      placeholder: "Local server, model name"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redacted log excerpt. It is rendered as code.
      render: text
