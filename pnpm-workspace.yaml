packages:
  - apps/*
  - packages/*
  - prototypes/*

# Exact versions only; the lockfile carries integrity hashes.
saveExact: true
engineStrict: true

# Supply-chain guard: ignore versions published less than seven days ago.
minimumReleaseAge: 10080

# Install scripts run only for reviewed packages.
allowBuilds:
  lefthook: true
  # Squirrel's installer tool comes with electron-builder; PartBuddy builds NSIS and does not need it.
  electron-winstaller: false

# Security override: GHSA-g3hv-75wg-m249 is fixed only in minimatch 11.0.1, while ESLint 10.13
# still requests ^10.2. ESLint is a development tool; the CI lint job shows that it still works.
overrides:
  minimatch: 11.0.3

# drei's <Line> disposed its material whenever its points changed, so every revision of a design compiled
# the edge shaders again (about a second of the renderer per revision in software WebGL). Still so in
# 10.7.9, the newest version: drop the patch once drei keeps the material. The patch is in core/Line.js (and
# core/Line.cjs.js); drei's index.cjs.js bundles its own unpatched copy, but Vite takes `module` (index.js),
# which imports core/Line.js.
patchedDependencies:
  '@react-three/drei@10.7.9': patches/react-three-drei-10.7.9.patch
